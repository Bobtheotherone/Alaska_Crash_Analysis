# target_mapping.yml — the single authoritative codebook for the crash-severity target.
#
# Loaded and hashed into every run by crashsev.contracts / crashsev.target (AA2-004).
# Changing any value here changes the encoded target and is recorded in the run manifest.
#
# Provenance: the mapping below is EMPIRICALLY VERIFIED against the raw 2009-2012 extract,
# not assumed. See data/codebook_verification_09_12.md (generated by
# data_audit/verify_codebook_09_12.py). Key evidence:
#   * blank Crash Severity -> 'O' (property-damage-only): 0.0% of the 32,046 blank-severity
#     crashes carry any positive fatality/injury count.
#   * the resulting 3-level balance (0.684 / 0.279 / 0.037) matches the original paper's
#     reported balance (0.677 / 0.287 / 0.035) to within 0.85 percentage points.

target_column: "Crash Severity"
scheme: KABCO
n_classes: 3
codebook_evidence: "data/codebook_verification_09_12.md"

# Text labels present in this extract -> KABCO letter.
text_to_kabco:
  Fatal: K
  Incapacitating: A
  Non-Incapacitating: B
  Possible: C

# Blank / NaN severity handling. Default policy is fail-closed (quarantine); this source
# OVERRIDES it to 'O' because blank is verified to denote property-damage-only here.
# Any override MUST cite evidence (above). Set to null to restore fail-closed quarantine.
blank_maps_to: O

# Numeric severity codes -> KABCO. This extract uses text labels, so none apply. A bare
# integer is NEVER guessed by sort order (that was the original DATA-002 defect); it must be
# listed here explicitly or it fails closed.
numeric_code_map: {}

# Values that are genuinely missing/unusable -> QUARANTINED (counted, never coerced to a class).
quarantine_labels:
  - "Unknown"
  - "Not Reported"
  - "Null value"

# KABCO meaning (most severe last).
kabco_definitions:
  K: "Fatal injury (killed)"
  A: "Suspected serious / incapacitating injury"
  B: "Suspected minor / non-incapacitating injury"
  C: "Possible injury"
  O: "No apparent injury / property damage only (PDO)"

# KABCO -> 3-level ordinal collapse (documented, reversible; raw KABCO retained separately).
kabco_to_ordinal:
  O: 0
  C: 1
  B: 1
  A: 2
  K: 2

# Standard national KABCO severity ordering (most severe last), for ordinal ranking.
kabco_rank:
  O: 0
  C: 1
  B: 2
  A: 3
  K: 4

class_labels:
  0: "none / property-damage-only (O)"
  1: "minor / possible injury (B, C)"
  2: "serious / fatal injury (A, K)"

# Fail-closed policy.
on_unknown_value: quarantine   # NEVER coerce to a class; count and report.
preserve_raw_label: true
require_mapping_audit: true    # raw + encoded counts must reconcile exactly.
