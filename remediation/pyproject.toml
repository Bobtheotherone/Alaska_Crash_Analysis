[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crashsev"
version = "0.2.0"
description = "Leakage-controlled, governed, reproducible framework for ordinal Alaska crash-severity classification."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "openpyxl>=3.1",   # read the raw .xlsx extract
]

[project.optional-dependencies]
# Optional candidate models (the study runs without them, recording their absence).
models = ["xgboost>=2.0", "interpret>=0.6"]
# Paper/figure build only (not needed to run the study).
paper = ["matplotlib>=3.7", "markdown>=3.5", "xhtml2pdf>=0.2.16", "reportlab>=4.0"]
test = ["pytest>=8.0"]
all = ["xgboost>=2.0", "interpret>=0.6", "matplotlib>=3.7", "markdown>=3.5",
       "xhtml2pdf>=0.2.16", "reportlab>=4.0", "pytest>=8.0"]

[tool.setuptools]
packages = ["crashsev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
